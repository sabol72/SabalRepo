<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="form-group">
      <p>Which self-improvement areas interest you the most?</p>
      <br />
      <label for="mindset-mental-health">
        <input
          type="checkbox"
          id="mindset-mental-health"
          name="self-improvement"
          value="mindset-mental-health"
          class="inline-group"
        />
        Mindset & Mental Health</label
      >
      <label for="financial-growth">
        <input
          type="checkbox"
          id="financial-growth"
          name="self-improvement"
          value="financial-growth"
          class="inline-group"
        />
        Financial Growth</label
      >
      <label for="productivity-time-management">
        <input
          type="checkbox"
          id="productivity-time-management"
          name="self-improvement"
          value="productivity-time-management"
          class="inline-group"
        />
        Productivity & Time Management</label
      >
      <label for="communication-skills">
        <input
          type="checkbox"
          id="communication-skills"
          name="self-improvement"
          value="communication-skills"
          class="inline-group"
        />
        Communication Skills</label
      >
      <label for="fitness-health">
        <input
          type="checkbox"
          id="fitness-health"
          name="self-improvement"
          value="fitness-health"
          class="inline-group"
        />
        Fitness & Health</label
      >
    </div>
  </body>
</html>
